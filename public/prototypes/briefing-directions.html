<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#fff9ea" />
  <title>Spool — Briefing directions</title>
  <style>
    :root {
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #293b57;
      background: #fff9ea;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --paper: #fff9ea;
      --paper-high: #fffefa;
      --paper-blue: #f3f8fc;
      --ink: #293b57;
      --copy: #536172;
      --muted: #7f8995;
      --ghost: #a4aab0;
      --blue: #6997c4;
      --baby: #afcbe7;
      --baby-soft: #dceaf6;
      --butter: #f3d979;
      --butter-soft: #fbefba;
      --sage: #8cbdae;
      --clay: #d98670;
      --line: rgba(41, 59, 87, .12);
      --line-soft: rgba(41, 59, 87, .07);
      --shadow: 0 18px 60px rgba(58, 73, 92, .09), 0 2px 10px rgba(58, 73, 92, .035);
      --ease: cubic-bezier(.23, 1, .32, 1);
    }
    * { box-sizing: border-box; }
    html, body { min-width: 320px; min-height: 100%; margin: 0; background: var(--paper); }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .22;
      background-image: radial-gradient(rgba(41, 59, 87, .13) .55px, transparent .55px);
      background-size: 22px 22px;
      mask-image: linear-gradient(to bottom, transparent, #000 18%, #000 82%, transparent);
    }
    button, a { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    button { font: inherit; color: inherit; }
    button:focus-visible, a:focus-visible { outline: 2px solid rgba(82, 125, 168, .5); outline-offset: 3px; }
    button:active { transform: scale(.96); }
    h1, h2, h3, p { text-wrap: pretty; }
    h1, h2, h3 { text-wrap: balance; }
    .skip-link { position: fixed; z-index: 2147483647; left: 12px; top: 12px; padding: 9px 12px; color: #fff; background: var(--ink); border-radius: 8px; transform: translateY(-180%); }
    .skip-link:focus { transform: translateY(0); }

    .product-shell { min-height: 100vh; }
    .rail {
      position: fixed;
      z-index: 30;
      inset: 0 auto 0 0;
      width: 58px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 7px;
      background: rgba(247, 249, 251, .88);
      border-right: 1px solid var(--line);
      backdrop-filter: blur(18px) saturate(1.2);
    }
    .brand-mark { position: relative; width: 28px; height: 28px; margin: 7px 0 22px; }
    .brand-mark i { position: absolute; display: block; border: 2px solid var(--blue); border-radius: 999px; transform: rotate(-29deg); }
    .brand-mark i:first-child { width: 23px; height: 13px; left: 0; top: 3px; }
    .brand-mark i:last-child { width: 19px; height: 12px; right: 0; bottom: 3px; border-color: #8cb5da; transform: rotate(35deg); }
    .rail-nav { display: grid; gap: 6px; }
    .rail-nav button, .rail-add {
      position: relative;
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      padding: 0;
      color: #718092;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      transition: color 150ms ease-out, background 150ms ease-out, transform 100ms ease-out;
    }
    .rail-nav button::before { content: attr(data-icon); font-size: 15px; }
    .rail-nav button.active { color: #315d89; background: rgba(175, 203, 231, .34); border-color: rgba(82, 125, 168, .18); }
    .rail-nav button.active::after { content: ""; position: absolute; left: -8px; width: 2px; height: 20px; border-radius: 2px; background: var(--blue); }
    .rail-spacer { flex: 1; }
    .rail-add { color: #fff; background: var(--ink); font-size: 20px; }
    .avatar { width: 30px; height: 30px; display: grid; place-items: center; margin-top: 10px; color: #315d89; background: var(--baby-soft); border: 1px solid rgba(82,125,168,.18); border-radius: 50%; font-size: 10px; font-weight: 700; }
    .app-main { min-height: 100vh; margin-left: 58px; }
    .app-bar {
      position: sticky;
      top: 0;
      z-index: 20;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      background: rgba(247, 249, 251, .84);
      box-shadow: 0 -1px 0 var(--line) inset;
      backdrop-filter: blur(18px) saturate(1.3);
    }
    .app-bar strong { height: 100%; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: rgba(255,255,255,.62); box-shadow: 1px 0 0 var(--line-soft), -1px 0 0 var(--line-soft); font-size: 10px; font-weight: 650; }
    .app-bar strong::before { content: "⌘"; color: var(--blue); font-size: 12px; }
    .add-link { min-height: 30px; padding: 0 11px; color: #fff; background: var(--ink); border: 0; border-radius: 6px; cursor: pointer; font-size: 9px; font-weight: 650; }
    .mobile-brand, .mobile-nav { display: none; }
    .brief-page { width: min(1120px, calc(100% - 52px)); margin: 0 auto; padding: 34px 0 104px; }
    .date { color: var(--blue); font-size: 8px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    .eyebrow { display: inline-flex; align-items: center; gap: 6px; color: var(--blue); font-size: 8px; font-weight: 780; letter-spacing: .11em; text-transform: uppercase; }
    .eyebrow::before { content: "✦"; font-size: 10px; }
    .soft-button, .text-button {
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 13px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 10px;
      font-weight: 650;
      transition: color 150ms ease-out, background 150ms ease-out, transform 100ms ease-out;
    }
    .soft-button { color: var(--ink); background: var(--butter); border: 1px solid rgba(174,139,24,.18); }
    .soft-button:hover { background: #edce62; }
    .text-button { color: #416f9d; background: transparent; border: 0; padding-inline: 0; }
    .mono { font-variant-numeric: tabular-nums; }
    .enter { animation: lift-in 260ms var(--ease) both; animation-delay: var(--delay, 0ms); }
    @keyframes lift-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* Direction 1 — editorial reading */
    .editorial-head { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 24px; margin-bottom: 22px; }
    .editorial-head h1 { margin: 8px 0 6px; color: var(--ink); font-size: clamp(35px, 5vw, 56px); line-height: .96; letter-spacing: -.06em; font-weight: 680; }
    .editorial-head h1 em { color: var(--blue); font-style: normal; }
    .editorial-head p { margin: 0; color: var(--muted); font-size: 11px; }
    .read-time { display: grid; justify-items: end; gap: 3px; padding-bottom: 4px; color: var(--muted); font-size: 8px; }
    .read-time strong { color: var(--ink); font-size: 15px; }
    .daily-paper { overflow: hidden; background: rgba(255,255,255,.8); border-radius: 16px; box-shadow: var(--shadow), 0 0 0 1px var(--line); }
    .paper-top { min-height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; box-shadow: 0 -1px 0 var(--line-soft) inset; }
    .paper-status { display: inline-flex; align-items: center; gap: 6px; padding: 5px 8px; color: #4b7768; background: rgba(140,189,174,.12); border-radius: 999px; font-size: 8px; font-weight: 700; }
    .paper-status i { width: 6px; height: 6px; background: var(--sage); border-radius: 50%; box-shadow: 0 0 0 4px rgba(140,189,174,.12); }
    .story-grid { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(280px, .55fr); }
    .lead-story { padding: clamp(28px, 5vw, 60px); }
    .story-source { color: var(--ghost); font-size: 9px; font-weight: 650; }
    .lead-story h2 { max-width: 720px; margin: 13px 0 14px; color: var(--ink); font-size: clamp(29px, 4.2vw, 48px); line-height: 1.04; letter-spacing: -.052em; font-weight: 690; }
    .lead-story > p { max-width: 690px; margin: 0; color: var(--copy); font-size: 13px; line-height: 1.7; }
    .memory-lines { display: grid; gap: 10px; margin: 25px 0 0; padding: 0; list-style: none; }
    .memory-lines li { display: grid; grid-template-columns: 20px 1fr; gap: 7px; color: var(--copy); font-size: 11px; line-height: 1.5; }
    .memory-lines b { color: var(--sage); font-size: 14px; }
    .action-note { display: flex; flex-direction: column; justify-content: center; padding: 34px; background: linear-gradient(150deg, rgba(243,217,121,.29), rgba(251,239,186,.48)); box-shadow: 1px 0 0 rgba(174,139,24,.12) inset; }
    .action-note span { color: #997519; font-size: 8px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .action-note h3 { margin: 14px 0 10px; color: var(--ink); font-size: 21px; line-height: 1.26; letter-spacing: -.03em; }
    .action-note p { margin: 0; color: var(--copy); font-size: 10px; line-height: 1.6; }
    .action-note .soft-button { align-self: flex-start; margin-top: 22px; }
    .paper-memory { min-height: 62px; display: grid; grid-template-columns: 180px 1fr auto; align-items: center; gap: 18px; padding: 10px 22px; background: rgba(175,203,231,.12); box-shadow: 0 1px 0 var(--line-soft) inset; }
    .paper-memory strong { font-size: 9px; }
    .paper-memory p { margin: 0; color: var(--copy); font-size: 10px; }
    .paper-memory button { min-height: 40px; color: #416f9d; background: transparent; border: 0; cursor: pointer; font-size: 9px; font-weight: 700; }
    .source-ribbon { margin-top: 30px; }
    .source-ribbon > header { display: flex; align-items: end; justify-content: space-between; margin-bottom: 10px; }
    .source-ribbon h3 { margin: 5px 0 0; font-size: 20px; letter-spacing: -.035em; }
    .source-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .mini-source { min-height: 88px; padding: 15px; background: rgba(255,255,255,.62); border: 0; border-radius: 12px; box-shadow: 0 0 0 1px var(--line); cursor: pointer; text-align: left; }
    .mini-source:hover { background: #fff; box-shadow: 0 0 0 1px rgba(82,125,168,.22); }
    .mini-source small { display: block; color: var(--blue); font-size: 8px; }
    .mini-source strong { display: block; margin-top: 7px; font-size: 11px; line-height: 1.3; }

    /* Direction 2 — action queue */
    .queue-head { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 22px; }
    .queue-head h1 { margin: 8px 0 5px; font-size: clamp(34px, 4.5vw, 50px); line-height: 1; letter-spacing: -.055em; }
    .queue-head p { margin: 0; color: var(--muted); font-size: 11px; }
    .progress-pill { min-height: 38px; display: flex; align-items: center; gap: 9px; padding: 0 13px; background: rgba(255,255,255,.72); border-radius: 999px; box-shadow: 0 0 0 1px var(--line); color: var(--muted); font-size: 9px; }
    .progress-pill b { color: var(--ink); font-size: 13px; }
    .queue-layout { display: grid; grid-template-columns: 210px minmax(0,1fr); gap: 15px; }
    .queue-steps { padding: 13px; background: rgba(255,255,255,.58); border-radius: 14px; box-shadow: 0 0 0 1px var(--line); }
    .queue-step { width: 100%; min-height: 74px; display: grid; grid-template-columns: 32px 1fr; align-items: center; gap: 10px; padding: 11px; color: var(--muted); background: transparent; border: 0; border-radius: 10px; cursor: pointer; text-align: left; }
    .queue-step.active { color: var(--ink); background: rgba(175,203,231,.2); box-shadow: 0 0 0 1px rgba(82,125,168,.1); }
    .queue-step:hover { color: var(--ink); }
    .queue-step i { width: 30px; height: 30px; display: grid; place-items: center; background: var(--paper-high); border-radius: 50%; box-shadow: 0 0 0 1px var(--line); font-style: normal; font-size: 10px; }
    .queue-step.active i { color: #8e6e17; background: var(--butter-soft); }
    .queue-step strong, .queue-step small { display: block; }
    .queue-step strong { font-size: 10px; }
    .queue-step small { margin-top: 3px; color: var(--ghost); font-size: 8px; }
    .queue-stage { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(260px, .8fr); gap: 12px; }
    .queue-card { padding: 25px; background: rgba(255,255,255,.78); border-radius: 14px; box-shadow: var(--shadow), 0 0 0 1px var(--line); }
    .queue-card h2 { margin: 11px 0 10px; font-size: clamp(25px, 3.2vw, 36px); line-height: 1.08; letter-spacing: -.045em; }
    .queue-card > p { margin: 0; color: var(--copy); font-size: 11px; line-height: 1.65; }
    .proof-strip { display: flex; align-items: center; gap: 8px; margin-top: 22px; }
    .proof-dot { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; color: #fff; background: var(--blue); border: 3px solid #fff; box-shadow: 0 0 0 1px rgba(82,125,168,.18); font-size: 7px; font-weight: 700; }
    .proof-dot:nth-child(2) { margin-left: -14px; background: var(--clay); }
    .proof-strip span { color: var(--muted); font-size: 8px; }
    .queue-action { display: flex; flex-direction: column; padding: 25px; background: linear-gradient(160deg, rgba(243,217,121,.38), rgba(255,255,255,.74)); border-radius: 14px; box-shadow: 0 0 0 1px rgba(174,139,24,.14); }
    .queue-action .check-circle { width: 40px; height: 40px; display: grid; place-items: center; color: #8f6f18; background: rgba(255,255,255,.72); border-radius: 50%; box-shadow: 0 0 0 1px rgba(174,139,24,.16); font-size: 16px; }
    .queue-action h3 { margin: 18px 0 9px; font-size: 18px; line-height: 1.27; letter-spacing: -.025em; }
    .queue-action p { margin: 0; color: var(--copy); font-size: 10px; line-height: 1.55; }
    .queue-action .soft-button { margin-top: auto; align-self: stretch; }
    .inbox-line { margin-top: 14px; padding: 0 4px; }
    .inbox-line > header { display: flex; align-items: center; justify-content: space-between; min-height: 42px; }
    .inbox-line h3 { margin: 0; font-size: 13px; }
    .line-item { min-height: 54px; display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 10px; padding: 6px 3px; box-shadow: 0 -1px 0 var(--line-soft) inset; }
    .line-item > i { width: 21px; height: 21px; display: grid; place-items: center; color: #4f7f6d; background: rgba(140,189,174,.12); border-radius: 50%; font-style: normal; font-size: 9px; }
    .line-item strong, .line-item small { display: block; }
    .line-item strong { font-size: 10px; }
    .line-item small { margin-top: 3px; color: var(--ghost); font-size: 8px; }
    .line-item > span:last-child { color: var(--muted); font-size: 8px; }

    /* Direction 3 — topic chapters */
    .chapters-head { display: grid; grid-template-columns: 1fr minmax(260px, .55fr); align-items: end; gap: 30px; margin-bottom: 24px; }
    .chapters-head h1 { margin: 8px 0 6px; font-size: clamp(36px, 5vw, 56px); line-height: .96; letter-spacing: -.06em; }
    .chapters-head p { margin: 0; color: var(--muted); font-size: 11px; }
    .chapter-summary { display: grid; grid-template-columns: repeat(3, 1fr); overflow: hidden; background: rgba(255,255,255,.6); border-radius: 12px; box-shadow: 0 0 0 1px var(--line); }
    .chapter-summary span { display: grid; gap: 3px; padding: 13px; box-shadow: -1px 0 0 var(--line-soft) inset; }
    .chapter-summary strong { font-size: 14px; }
    .chapter-summary small { color: var(--ghost); font-size: 7px; }
    .chapter-tabs { display: flex; gap: 7px; overflow-x: auto; padding: 2px 2px 12px; scrollbar-width: none; }
    .chapter-tabs::-webkit-scrollbar { display: none; }
    .chapter-tab { min-height: 40px; flex: 0 0 auto; padding: 0 14px; color: var(--muted); background: rgba(255,255,255,.62); border: 0; border-radius: 999px; box-shadow: 0 0 0 1px var(--line); cursor: pointer; font-size: 9px; font-weight: 650; }
    .chapter-tab.active { color: #315d89; background: var(--baby-soft); box-shadow: 0 0 0 1px rgba(82,125,168,.18); }
    .chapter-grid { display: grid; grid-template-columns: minmax(0,1.2fr) minmax(300px,.8fr); gap: 14px; }
    .chapter-main, .chapter-aside { background: rgba(255,255,255,.78); border-radius: 15px; box-shadow: var(--shadow), 0 0 0 1px var(--line); }
    .chapter-main { padding: clamp(25px, 4vw, 42px); }
    .chapter-color { width: 46px; height: 7px; background: linear-gradient(90deg, var(--butter), var(--baby)); border-radius: 999px; }
    .chapter-main h2 { margin: 18px 0 10px; font-size: clamp(28px, 4vw, 41px); line-height: 1.04; letter-spacing: -.05em; }
    .chapter-main > p { margin: 0; color: var(--copy); font-size: 12px; line-height: 1.68; }
    .chapter-lessons { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; margin-top: 25px; }
    .lesson { padding: 14px; background: rgba(175,203,231,.1); border-radius: 10px; box-shadow: 0 0 0 1px rgba(82,125,168,.08); }
    .lesson b { display: block; color: var(--blue); font-size: 8px; letter-spacing: .08em; }
    .lesson p { margin: 7px 0 0; color: var(--copy); font-size: 10px; line-height: 1.45; }
    .chapter-aside { overflow: hidden; }
    .aside-action { padding: 24px; background: rgba(243,217,121,.25); box-shadow: 0 -1px 0 rgba(174,139,24,.12) inset; }
    .aside-action h3 { margin: 10px 0 8px; font-size: 18px; line-height: 1.25; }
    .aside-action p { margin: 0; color: var(--copy); font-size: 9px; line-height: 1.55; }
    .aside-action .soft-button { margin-top: 17px; }
    .chapter-sources { padding: 17px 20px 20px; }
    .chapter-sources > span { color: var(--ghost); font-size: 8px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
    .chapter-source { width: 100%; display: grid; grid-template-columns: 32px 1fr; gap: 9px; align-items: center; padding: 12px 0; background: transparent; border: 0; box-shadow: 0 -1px 0 var(--line-soft) inset; cursor: pointer; text-align: left; }
    .chapter-source i { width: 30px; height: 30px; display: grid; place-items: center; color: #fff; background: var(--blue); border-radius: 8px; font-style: normal; font-size: 8px; }
    .chapter-source:nth-of-type(2) i { background: var(--clay); }
    .chapter-source strong, .chapter-source small { display: block; }
    .chapter-source:hover strong { color: #315d89; }
    .chapter-source strong { font-size: 9px; }
    .chapter-source small { margin-top: 3px; color: var(--ghost); font-size: 7px; }

    /* Direction 4 — spatial map */
    .map-head { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 15px; }
    .map-head h1 { margin: 8px 0 5px; font-size: clamp(34px, 4.5vw, 50px); line-height: 1; letter-spacing: -.055em; }
    .map-head p { margin: 0; color: var(--muted); font-size: 11px; }
    .map-legend { display: flex; align-items: center; gap: 12px; padding-bottom: 4px; color: var(--ghost); font-size: 8px; }
    .map-legend span { display: inline-flex; align-items: center; gap: 5px; }
    .map-legend i { width: 7px; height: 7px; border-radius: 50%; }
    .map-legend span:first-child i { background: var(--butter); }
    .map-legend span:last-child i { background: var(--baby); }
    .map-workspace { min-height: 610px; display: grid; grid-template-columns: minmax(0,1.4fr) minmax(285px,.6fr); overflow: hidden; background: rgba(255,255,255,.62); border-radius: 16px; box-shadow: var(--shadow), 0 0 0 1px var(--line); }
    .brief-map { position: relative; min-height: 610px; overflow: hidden; background-color: rgba(255,254,250,.72); background-image: radial-gradient(rgba(41,59,87,.14) .6px, transparent .6px); background-size: 20px 20px; }
    .brief-map::before { content: ""; position: absolute; width: 520px; height: 520px; left: 50%; top: 50%; transform: translate(-50%,-50%); border: 1px solid rgba(82,125,168,.07); border-radius: 50%; }
    .map-line { position: absolute; z-index: 1; height: 1px; left: 50%; top: 50%; width: var(--w); background: linear-gradient(90deg, rgba(82,125,168,.34), rgba(82,125,168,.1)); transform-origin: left center; transform: rotate(var(--r)); }
    .map-line::after { content: ""; position: absolute; inset: -1px 0 auto; height: 3px; opacity: .25; background: inherit; filter: blur(3px); }
    .map-node { position: absolute; z-index: 3; width: var(--size, 44px); height: var(--size, 44px); display: grid; place-items: center; padding: 0; background: var(--node); border: 3px solid #fff; border-radius: 50%; box-shadow: 0 0 0 8px color-mix(in srgb, var(--node) 16%, transparent), 0 8px 24px color-mix(in srgb, var(--node) 25%, transparent); cursor: pointer; transition: transform 180ms var(--ease); }
    .map-node:hover, .map-node.active { transform: scale(1.1); box-shadow: 0 0 0 12px color-mix(in srgb, var(--node) 18%, transparent), 0 12px 30px color-mix(in srgb, var(--node) 32%, transparent); }
    .map-node span { position: absolute; top: calc(100% + 11px); width: 120px; color: var(--ink); font-size: 9px; font-weight: 750; }
    .map-node small { display: block; margin-top: 3px; color: var(--ghost); font-size: 7px; font-weight: 500; }
    .map-center { --size: 72px; --node: var(--butter); left: calc(50% - 36px); top: calc(50% - 36px); }
    .map-center span { top: 24px; color: #705817; text-align: center; }
    .map-ai { --node: var(--baby); left: 18%; top: 23%; }
    .map-career { --node: var(--clay); left: 72%; top: 25%; }
    .map-life { --node: var(--sage); left: 20%; top: 70%; }
    .map-growth { --node: #c9bdde; left: 71%; top: 68%; }
    .reel-dot { position: absolute; z-index: 2; width: 11px; height: 11px; background: #fff; border: 3px solid var(--blue); border-radius: 50%; box-shadow: 0 0 0 4px rgba(175,203,231,.18); }
    .map-panel { display: flex; flex-direction: column; padding: 28px; background: rgba(255,255,255,.82); box-shadow: 1px 0 0 var(--line-soft) inset; }
    .panel-topic { display: inline-flex; align-items: center; gap: 7px; color: var(--blue); font-size: 8px; font-weight: 750; letter-spacing: .1em; text-transform: uppercase; }

    .map-panel h2 { margin: 16px 0 10px; font-size: 27px; line-height: 1.08; letter-spacing: -.045em; }
    .map-panel > p { margin: 0; color: var(--copy); font-size: 10px; line-height: 1.62; }
    .map-panel blockquote { margin: 24px 0 0; padding: 15px 0 15px 15px; color: var(--copy); border-left: 3px solid var(--butter); font-size: 11px; line-height: 1.55; }
    .map-panel .soft-button { margin-top: auto; align-self: flex-start; }
    .panel-sources { display: flex; align-items: center; gap: 8px; margin-top: 22px; color: var(--ghost); font-size: 8px; }
    .panel-sources i { width: 23px; height: 23px; display: grid; place-items: center; margin-right: -14px; color: #fff; background: var(--blue); border: 2px solid #fff; border-radius: 50%; font-style: normal; font-size: 6px; }

    .proto-picker {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2147483647;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 4px;
      border-radius: 999px;
      background: rgba(10, 10, 10, 0.82);
      -webkit-backdrop-filter: blur(12px) saturate(1.4);
      backdrop-filter: blur(12px) saturate(1.4);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.08) inset,
        0 8px 24px rgba(0, 0, 0, 0.24),
        0 2px 6px rgba(0, 0, 0, 0.12);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      line-height: 1;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
    }
    .proto-picker-highlight { position: absolute; top: 4px; left: 0; height: 28px; border-radius: 999px; background: rgba(255, 255, 255, 0.12); will-change: transform; }
    .proto-picker[data-ready] .proto-picker-highlight { transition: transform 250ms cubic-bezier(0.23, 1, 0.32, 1), width 250ms cubic-bezier(0.23, 1, 0.32, 1); }
    @media (prefers-reduced-motion: reduce) { .proto-picker[data-ready] .proto-picker-highlight { transition: none; } }
    .proto-picker-item { position: relative; display: flex; align-items: center; height: 28px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; color: rgba(255, 255, 255, 0.55); font: inherit; cursor: pointer; transition: color 150ms ease-out; }
    .proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); }
    .proto-picker-item:active { transform: scale(0.97); }
    .proto-picker-item:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.4); outline-offset: 2px; }
    .proto-picker-item[data-active] { color: #fff; }
    .proto-picker-divider { width: 1px; height: 16px; margin: 0 4px; background: rgba(255, 255, 255, 0.12); }

      .mobile-brand .brand-mark { width: 27px; height: 27px; margin: 0; }

      .mobile-brand span { margin-left: auto; color: var(--ghost); font-size: 15px; }
      .mobile-nav { position: fixed; z-index: 40; inset: auto 10px calc(8px + env(safe-area-inset-bottom)) 10px; min-height: 62px; display: grid; grid-template-columns: repeat(4,1fr); padding: 5px; background: rgba(255,255,255,.88); border-radius: 15px; box-shadow: 0 10px 35px rgba(41,59,87,.15), 0 0 0 1px var(--line); backdrop-filter: blur(20px) saturate(1.4); }
      .mobile-nav button { min-width: 44px; min-height: 50px; display: grid; place-items: center; gap: 2px; padding: 5px; color: var(--ghost); background: transparent; border: 0; border-radius: 11px; font-size: 8px; }

      .paper-memory { grid-template-columns: 1fr auto; gap: 6px 12px; }
      .paper-memory p { grid-column: 1 / -1; grid-row: 2; }
      .source-row { grid-template-columns: 1fr; }
      .queue-layout { grid-template-columns: 1fr; }
      .queue-steps { display: grid; grid-template-columns: repeat(3,1fr); gap: 5px; padding: 6px; }
      .queue-step { min-height: 56px; grid-template-columns: 1fr; justify-items: center; gap: 4px; padding: 6px; text-align: center; }
      .queue-step i { width: 25px; height: 25px; }
      .queue-step small { display: none; }
      .queue-action .soft-button { margin-top: 22px; }
      .chapters-head { grid-template-columns: 1fr; gap: 16px; }
      .chapter-lessons { grid-template-columns: 1fr; }
      .map-workspace { min-height: 720px; grid-template-columns: 1fr; grid-template-rows: 390px auto; }
      .brief-map { min-height: 390px; }
      .brief-map::before { width: 340px; height: 340px; }
      .map-panel { min-height: 300px; box-shadow: 0 1px 0 var(--line-soft) inset; }
      .map-panel .soft-button { margin-top: 22px; }
      .map-node span { width: 100px; }
    }
    @media (max-width: 560px) {
      .editorial-head, .queue-head, .map-head { display: block; }
      .read-time, .progress-pill, .map-legend { display: none; }
      .editorial-head h1, .queue-head h1, .chapters-head h1, .map-head h1 { font-size: 37px; }
      .paper-top { padding-inline: 15px; }
      .lead-story, .action-note, .queue-card, .queue-action, .chapter-main, .aside-action, .map-panel { padding: 22px 18px; }
      .lead-story h2 { font-size: 29px; }
      .paper-memory { padding: 11px 15px; }
      .paper-memory > strong { font-size: 8px; }
      .source-ribbon { margin-top: 24px; }
      .queue-card h2, .chapter-main h2 { font-size: 28px; }
      .chapter-summary span { padding: 10px 8px; }
      .chapter-summary strong { font-size: 12px; }
      .chapter-summary small { font-size: 6px; }
      .map-workspace { min-height: 700px; grid-template-rows: 370px auto; }
      .brief-map { min-height: 370px; }
      .map-center { --size: 62px; left: calc(50% - 31px); top: calc(50% - 31px); }
      .map-ai { left: 12%; top: 20%; }
      .map-career { left: 72%; top: 22%; }
      .map-life { left: 13%; top: 70%; }
      .map-growth { left: 71%; top: 68%; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
      .enter { transform: none; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to Briefing</a>
  <div class="product-shell">
    <aside class="rail" aria-label="Spool navigation">
      <div class="brand-mark" aria-hidden="true"><i></i><i></i></div>
      <nav class="rail-nav">
        <button class="active" data-icon="✦" aria-label="Briefing"></button>
        <button data-icon="◇" aria-label="Knowledge"></button>
        <button data-icon="♙" aria-label="Creators"></button>
        <button data-icon="↗" aria-label="iPhone capture"></button>
      </nav>
      <div class="rail-spacer"></div>
      <button class="rail-add" aria-label="Add link">+</button>
      <div class="avatar">Y</div>
    </aside>
    <main class="app-main" id="main-content">
      <header class="app-bar"><strong>Briefing</strong><button class="add-link">＋ Add link</button></header>
      <header class="mobile-brand"><div class="brand-mark" aria-hidden="true"><i></i><i></i></div><strong>spool</strong><span>☰</span></header>
      <div id="stage"></div>
    </main>
    <nav class="mobile-nav" aria-label="Mobile navigation">
      <button class="active"><b>✦</b>Briefing</button><button><b>◇</b>Knowledge</button><button><b>♙</b>Creators</button><button><b>↗</b>Setup</button>
    </nav>
  </div>

  <nav class="proto-picker" aria-label="Prototype variants" data-position="top">
    <span class="proto-picker-highlight" aria-hidden="true"></span>
    <button class="proto-picker-item" data-active aria-current="true">Paper</button>
    <button class="proto-picker-item">Queue</button>
    <button class="proto-picker-item">Chapters</button>
    <button class="proto-picker-item">Map</button>
    <span class="proto-picker-divider" aria-hidden="true"></span>
    <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
  </nav>

  <script>
    const sources = [
      ["@rafakeunecke", "US Open Fan Week tennis outfit", "Vlogs & Life"],
      ["@renaliyt", "Cover letter that landed Spotify PM", "Career"],
      ["@gazisj", "Build taste through orthogonal intersection", "Personal Growth"]
    ];
    const sourceCards = () => sources.map(([creator,title,topic]) => `<button class="mini-source"><small>${creator} · ${topic}</small><strong>${title}</strong></button>`).join("");
    const today = new Intl.DateTimeFormat('en-US', { weekday: 'long', month: 'long', day: 'numeric' }).format(new Date());
    const commonHead = (title, copy, cls) => `<header class="${cls} enter"><div><span class="date">${today}</span><h1>${title}</h1><p>${copy}</p></div>`;
    const variants = [
      () => `<div class="brief-page direction-editorial">
        ${commonHead("Today’s <em>briefing.</em>", "One useful idea. One small action. Three minutes.", "editorial-head")}
          <div class="read-time"><strong class="mono">03:00</strong><span>comfortable read</span></div></header>
        <article class="daily-paper enter" style="--delay:60ms">
          <header class="paper-top"><span class="eyebrow">Today’s pattern</span><span class="paper-status"><i></i> fresh</span></header>
          <div class="story-grid">
            <section class="lead-story"><span class="story-source">@rafakeunecke · 2 supporting saves</span><h2>Timing turns a simple outfit reel into an event story.</h2><p>Pair a same-day cultural moment with a personal reveal. The event supplies attention; the outfit gives the audience something specific to notice and remember.</p><ul class="memory-lines"><li><b>✓</b><span>Open with the live moment, then reveal the personal angle.</span></li><li><b>✓</b><span>Tag the event and the brand only where each adds context.</span></li></ul><button class="text-button">Explore in Second Brain →</button></section>
            <aside class="action-note"><span>Try this next</span><h3>Make one timely post around something already happening today.</h3><p>Keep the experiment small: one event, one personal angle, one clear reason to care.</p><button class="soft-button" data-done>Mark as tried ✓</button></aside>
          </div>
          <div class="paper-memory"><strong>ONE THING TO REMEMBER</strong><p data-memory>Can you explain the pattern in one sentence?</p><button data-reveal>Show answer</button></div>
        </article>
        <section class="source-ribbon enter" style="--delay:120ms"><header><div><span class="date">Source index</span><h3>Behind today’s brief</h3></div><button class="text-button">See all 7 saves →</button></header><div class="source-row">${sourceCards()}</div></section>
      </div>`,
      () => `<div class="brief-page direction-queue">
        ${commonHead("Three things worth your attention.", "A tiny queue, ordered by what helps you most.", "queue-head")}<div class="progress-pill"><b class="mono">1 / 3</b><span>complete</span></div></header>
        <div class="queue-layout">
          <aside class="queue-steps enter"><button class="queue-step active"><i>01</i><span><strong>Remember</strong><small>The idea</small></span></button><button class="queue-step"><i>02</i><span><strong>Try</strong><small>The action</small></span></button><button class="queue-step"><i>03</i><span><strong>Review</strong><small>The sources</small></span></button></aside>
          <div>
            <div class="queue-stage">
              <article class="queue-card enter" style="--delay:50ms"><span class="eyebrow">Remember this</span><h2>Borrow the attention. Own the angle.</h2><p>A live event makes the reel timely, but the creator’s personal reveal is what makes it memorable. Use both; don’t confuse one for the other.</p><div class="proof-strip"><i class="proof-dot">RK</i><i class="proof-dot">GZ</i><span>Seen across 2 saved Reels</span></div><button class="text-button">Open pattern →</button></article>
              <aside class="queue-action enter" style="--delay:90ms"><div class="check-circle">✓</div><h3>Post one timely personal angle today.</h3><p>Use a current event as the doorway—not the whole room.</p><button class="soft-button" data-done>Done for today</button></aside>
            </div>
            <section class="inbox-line enter" style="--delay:130ms"><header><h3>Review only if you have time</h3><span class="date">3 recent saves</span></header>${sources.map(([c,t,k]) => `<div class="line-item"><i>✓</i><span><strong>${t}</strong><small>${c}</small></span><span>${k}</span></div>`).join("")}</section>
          </div>
        </div>
      </div>`,
      () => `<div class="brief-page direction-chapters">
        ${commonHead("Your day, in chapters.", "Browse the topic you care about; ignore the rest.", "chapters-head")}<div class="chapter-summary"><span><strong class="mono">4</strong><small>topics active</small></span><span><strong class="mono">7</strong><small>saves read</small></span><span><strong class="mono">3</strong><small>patterns</small></span></div></header>
        <nav class="chapter-tabs enter" aria-label="Briefing topics"><button class="chapter-tab active">All highlights</button><button class="chapter-tab">Vlogs & Life · 2</button><button class="chapter-tab">Career · 1</button><button class="chapter-tab">Personal Growth · 2</button></nav>
        <div class="chapter-grid">
          <article class="chapter-main enter" style="--delay:60ms"><div class="chapter-color"></div><h2>Vlogs & Life is teaching you how to turn timing into story.</h2><p>The strongest pattern from today: use an event people already recognize, then make it yours through one specific personal detail.</p><div class="chapter-lessons"><div class="lesson"><b>01 · HOOK</b><p>Name the live moment in the first beat.</p></div><div class="lesson"><b>02 · PAYOFF</b><p>Reveal the personal angle before explaining.</p></div></div><button class="text-button">Open this topic in Second Brain →</button></article>
          <aside class="chapter-aside enter" style="--delay:100ms"><div class="aside-action"><span class="eyebrow">One action</span><h3>Draft a post from one thing happening today.</h3><p>Spool pulled this directly from your Vlogs & Life saves.</p><button class="soft-button" data-done>Save as today’s task</button></div><div class="chapter-sources"><span>Supporting saves</span>${sources.slice(0,2).map(([c,t]) => `<button class="chapter-source"><i>${c.slice(1,3).toUpperCase()}</i><span><strong>${t}</strong><small>${c}</small></span></button>`).join("")}</div></aside>
        </div>
      </div>`,
      () => `<div class="brief-page direction-map">
        ${commonHead("See what’s pulling your attention.", "Today’s ideas, arranged around the themes they strengthen.", "map-head")}<div class="map-legend"><span><i></i>today’s pattern</span><span><i></i>topic cluster</span></div></header>
        <div class="map-workspace enter" style="--delay:50ms">
          <div class="brief-map" aria-label="Interactive map of today’s briefing">
            <i class="map-line" style="--w:165px;--r:-142deg"></i><i class="map-line" style="--w:175px;--r:-35deg"></i><i class="map-line" style="--w:165px;--r:139deg"></i><i class="map-line" style="--w:175px;--r:34deg"></i>
            <button class="map-node map-center active" data-topic="Today"><span>Today</span></button>
            <button class="map-node map-ai" style="--node:var(--baby)" data-topic="Vlogs & Life"><span>Vlogs & Life<small>2 saves</small></span></button>
            <button class="map-node map-career" style="--node:var(--clay)" data-topic="Career"><span>Career<small>1 save</small></span></button>
            <button class="map-node map-life" style="--node:var(--sage)" data-topic="Personal Growth"><span>Personal Growth<small>2 saves</small></span></button>
            <button class="map-node map-growth" style="--node:#c9bdde" data-topic="Creators"><span>Creators<small>2 saves</small></span></button>
            <i class="reel-dot" style="left:13%;top:37%"></i><i class="reel-dot" style="left:29%;top:15%;border-color:var(--clay)"></i><i class="reel-dot" style="left:80%;top:16%;border-color:var(--clay)"></i><i class="reel-dot" style="left:79%;top:53%;border-color:var(--sage)"></i><i class="reel-dot" style="left:29%;top:82%;border-color:#9c87ba"></i>
          </div>
          <aside class="map-panel"><span class="panel-topic"><i></i><b data-panel-topic>Today’s strongest connection</b></span><h2 data-panel-title>Timely moments make personal stories travel further.</h2><p data-panel-copy>Two saves connected a live event with a personal reveal. That combination is the clearest pattern in your library today.</p><blockquote data-panel-quote>Use the event as the doorway, then give people a reason to stay for your point of view.</blockquote><div class="panel-sources"><i>RK</i><i>GZ</i><span>2 supporting Reels</span></div><button class="soft-button">Open this connection →</button></aside>
        </div>
      </div>`
    ];

    const stage = document.getElementById('stage');
    const picker = document.querySelector('.proto-picker');
    const highlight = picker.querySelector('.proto-picker-highlight');
    const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
    const replay = picker.querySelector('.proto-picker-replay');
    let current = 0;
    function moveHighlight() { const el = items[current]; highlight.style.width = el.offsetWidth + 'px'; highlight.style.transform = `translateX(${el.offsetLeft}px)`; }
    function mount(i) { stage.innerHTML = ''; requestAnimationFrame(() => { stage.innerHTML = variants[i](); }); }
    function setActive(i) {
      if (i < 0 || i >= variants.length) return;
      current = i;
      items.forEach((el, j) => { el.toggleAttribute('data-active', j === i); if (j === i) el.setAttribute('aria-current', 'true'); else el.removeAttribute('aria-current'); });
      moveHighlight();
      const url = new URL(location); url.searchParams.set('v', i + 1); history.replaceState(null, '', url); mount(i);
    }
    items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
    replay?.addEventListener('click', () => mount(current));
    window.addEventListener('resize', moveHighlight);
    document.addEventListener('keydown', (e) => {
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const num = parseInt(e.key, 10);
      if (num >= 1 && num <= variants.length) setActive(num - 1);
      else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
      else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
      else if (e.key === 'r' || e.key === 'R') mount(current);
    });
    stage.addEventListener('click', (e) => {
      const reveal = e.target.closest('[data-reveal]');
      if (reveal) { const p = stage.querySelector('[data-memory]'); const showing = reveal.textContent === 'Hide answer'; p.textContent = showing ? 'Can you explain the pattern in one sentence?' : 'Borrow the attention of the moment, then make the story unmistakably yours.'; reveal.textContent = showing ? 'Show answer' : 'Hide answer'; }
      const done = e.target.closest('[data-done]');
      if (done) { done.textContent = done.textContent.includes('Done ✓') ? 'Mark as tried ✓' : 'Done ✓'; done.style.background = 'var(--sage)'; done.style.color = '#fff'; }
      const step = e.target.closest('.queue-step');
      if (step) { stage.querySelectorAll('.queue-step').forEach(x => x.classList.toggle('active', x === step)); }
      const tab = e.target.closest('.chapter-tab');
      if (tab) { stage.querySelectorAll('.chapter-tab').forEach(x => x.classList.toggle('active', x === tab)); }
      const node = e.target.closest('.map-node');
      if (node) {
        stage.querySelectorAll('.map-node').forEach(x => x.classList.toggle('active', x === node));
        const topic = node.dataset.topic;
        const details = {
          'Today': ['Today’s strongest connection','Timely moments make personal stories travel further.','Two saves connected a live event with a personal reveal. That combination is the clearest pattern in your library today.','Use the event as the doorway, then give people a reason to stay for your point of view.'],
          'Vlogs & Life': ['Vlogs & Life','Build the story around one lived detail.','The strongest lifestyle saves use a recognizable moment, then quickly narrow to something personal and specific.','Specific details turn a generic update into a scene people can remember.'],
          'Career': ['Career','Proof beats polish in application stories.','Your career saves favor specific documents, outcomes, and examples over broad motivational advice.','Show the artifact that worked, then explain the decisions behind it.'],
          'Personal Growth': ['Personal Growth','Taste grows at the intersection of unlike inputs.','Two saves connect stronger creative judgment with deliberately crossing categories and references.','Collect beyond your niche, then name the connection only you noticed.'],
          'Creators': ['Creators','Study repeatable choices, not surface aesthetics.','Your creator saves are beginning to reveal recurring hooks, structures, and ways of explaining.','Copy the decision system behind the style—not the creator’s personality.']
        }[topic];
        ['topic','title','copy','quote'].forEach((key, i) => stage.querySelector(`[data-panel-${key}]`).textContent = details[i]);
      }
    });
    setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
    requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
  </script>
</body>
